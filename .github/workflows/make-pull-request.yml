name: Generate a Pull Request

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  make-pull-request:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$GITHUB_RUN_ID" >run-id.txt

      - id: commit
        uses: amezin/create-commit-action@8be59a286400afb58d31dc15e51372fe17fb2f74 # v2.0.6
        with:
          message: Auto-generated commit
          files: run-id.txt

      - uses: amezin/create-or-update-pull-request-action@0abe94508b600c8b5d8d4977ec0fd4e88abf7cb2 # v2.1.0
        with:
          title: Auto-generated Pull Request
          head: auto-generated
          head_sha: ${{ steps.commit.outputs.sha }}
